name: CI - Test, Build, Publish and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-docker.txt
          pip install pytest httpx2

      - name: Run unit and API tests
        run: |
          pytest -v

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/cats-dogs-api
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Minikube
    runs-on: self-hosted
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify deployment environment
        run: |
          docker --version
          kubectl version --client
          minikube version

      - name: Verify Minikube
        run: |
          minikube status
          kubectl get nodes

      - name: Pull latest Docker image
        run: |
          docker pull ghcr.io/basavarajurevannakumar/cats-dogs-api:latest

      - name: Load image into Minikube
        run: |
          minikube image load ghcr.io/basavarajurevannakumar/cats-dogs-api:latest

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      - name: Update deployment image
        run: |
          kubectl set image deployment/cats-dogs-api \
            cats-dogs-api=ghcr.io/basavarajurevannakumar/cats-dogs-api:latest

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/cats-dogs-api --timeout=180s

      - name: Verify deployment
        run: |
          kubectl get deployment cats-dogs-api
          kubectl get pods -l app=cats-dogs-api
          kubectl get service cats-dogs-service

      - name: Run smoke tests
        run: |
          ./scripts/smoke_test.sh
